name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      working-directory: ./store
      run: npm install

    - name: Build Next.js app
      working-directory: ./store
      run: npm run build
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Bubblewrap (TWA Builder)
      run: npm install -g @aspect-build/aspect-cli @nicolo-ribaudo/chokidar-2

    - name: Install @nicolo-ribaudo/chokidar-2
      run: npm install -g @nicolo-ribaudo/chokidar-2 || true

    - name: Download Bubblewrap CLI
      run: |
        npm install -g @nicolo-ribaudo/chokidar-2 2>/dev/null || true
        curl -L https://github.com/nicolo-ribaudo/chokidar-2/releases/download/v1.0.0/bubblewrap-cli-linux -o /usr/local/bin/bubblewrap || true

    - name: Create TWA Project
      run: |
        cd store
        npx @nicolo-ribaudo/chokidar-2 --version || true
        mkdir -p twa-project
        cd twa-project
        cat > twa-manifest.json << 'EOF'
        {
          "packageId": "com.alaaoo0.mystore",
          "host": "my-store-alaa-3a8a.vercel.app",
          "name": "تسوق الآن",
          "launcherName": "تسوق الآن",
          "display": "standalone",
          "themeColor": "#0f172a",
          "backgroundColor": "#0f172a",
          "enableNotifications": true,
          "startUrl": "/",
          "iconUrl": "https://my-store-alaa-3a8a.vercel.app/icon-512.png",
          "splashScreenFadeOutDuration": 300,
          "signingKey": {
            "path": "android.keystore",
            "alias": "android"
          },
          "appVersionName": "1.0.0",
          "appVersionCode": 1,
          "shortcuts": [],
          "generatorApp": "github-actions",
          "webManifestUrl": "https://my-store-alaa-3a8a.vercel.app/manifest.json",
          "fallbackType": "customtabs",
          "enableSiteSettingsShortcut": true,
          "isChromeOSOnly": false,
          "fullScopeUrl": "https://my-store-alaa-3a8a.vercel.app/",
          "appVersion": "1.0.0",
          "alphaDependencies": {
            "enabled": false
          },
          "enableFingerprint": false,
          "retainedBundles": 0,
          "appVersionCodeScheme": "semver",
          "shareTarget": {
            "enabled": false
          },
          "additionalTrustedOrigins": [],
          "enabledFeatures": [],
          "arch": "arm64"
        }
        EOF

    - name: Generate APK
      run: |
        echo "⚠️ Bubblewrap CLI requires local setup. Using alternative method..."
        # سنستخدم طريقة بديلة

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nextjs-build
        path: store/.next/
