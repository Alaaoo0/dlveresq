name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install jq
      run: sudo apt-get install -y jq

    - name: Start PWA Builder Packaging
      id: start
      run: |
        RESPONSE=$(curl -s -X POST "https://pwabuilder-cloud-packaging.azurewebsites.net/api/packages" \
          -H "Content-Type: application/json" \
          -d '{
            "platformId": "android",
            "siteId": "my-store",
            "siteUrl": "https://my-store-alaa-3a8a.vercel.app",
            "generatorType": "PWABuilder",
            "packageId": "com.alaaoo0.mystore",
            "appName": "تسوق الآن",
            "appVersionName": "1.0.0",
            "appVersionCode": 1
          }')
        echo "Response: $RESPONSE"
        JOB_ID=$(echo "$RESPONSE" | jq -r '.id')
        echo "job_id=$JOB_ID" >> $GITHUB_OUTPUT
        echo "✅ Job started: $JOB_ID"

    - name: Wait for Build to Complete
      run: |
        JOB_ID="${{ steps.start.outputs.job_id }}"
        STATUS=""
        for i in $(seq 1 30); do
          RESPONSE=$(curl -s "https://pwabuilder-cloud-packaging.azurewebsites.net/api/packages/$JOB_ID")
          STATUS=$(echo "$RESPONSE" | jq -r '.status')
          echo "Attempt $i - Status: $STATUS"
          if [ "$STATUS" = "completed" ]; then
            echo "✅ Build completed!"
            break
          fi
          if [ "$STATUS" = "error" ] || [ "$STATUS" = "failed" ]; then
            echo "❌ Build failed!"
            echo "$RESPONSE"
            exit 1
          fi
          sleep 10
        done
        if [ "$STATUS" != "completed" ]; then
          echo "❌ Build timed out"
          exit 1
        fi

    - name: Download APK Package
      run: |
        JOB_ID="${{ steps.start.outputs.job_id }}"
        RESPONSE=$(curl -s "https://pwabuilder-cloud-packaging.azurewebsites.net/api/packages/$JOB_ID")
        DOWNLOAD_URL=$(echo "$RESPONSE" | jq -r '.downloadUrl')
        echo "Download URL: $DOWNLOAD_URL"
        curl -s -L -o package.zip "$DOWNLOAD_URL"
        unzip -o package.zip -d apk-output/
        ls -la apk-output/

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: apk-output/
        if-no-files-found: error
