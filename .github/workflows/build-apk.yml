name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Bubblewrap
      run: npm install -g @nicolo-ribaudo/chokidar-2 @nicolo-ribaudo/chokidar-2

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Bubblewrap CLI
      run: |
        npm install -g @nicolo-ribaudo/chokidar-2 2>/dev/null || true
        curl -L "https://github.com/nicolo-ribaudo/chokidar-2/releases/download/v1.0.0/bubblewrap-cli-linux" -o /usr/local/bin/bubblewrap || true
        chmod +x /usr/local/bin/bubblewrap || true

    - name: Create TWA Project
      run: |
        mkdir -p twa-project
        cd twa-project
        
        cat > twa-manifest.json << 'EOF'
        {
          "packageId": "com.alaaoo0.mystore",
          "host": "my-store-alaa-3a8a.vercel.app",
          "name": "تسوق الآن",
          "launcherName": "تسوق الآن",
          "display": "standalone",
          "themeColor": "#dc2626",
          "backgroundColor": "#dc2626",
          "enableNotifications": true,
          "startUrl": "/",
          "iconUrl": "https://my-store-alaa-3a8a.vercel.app/icon-512.png",
          "splashScreenFadeOutDuration": 300,
          "signingKey": {
            "path": "android.keystore",
            "alias": "android"
          },
          "appVersionName": "1.0.0",
          "appVersionCode": 1,
          "shortcuts": [],
          "generatorApp": "github-actions",
          "webManifestUrl": "https://my-store-alaa-3a8a.vercel.app/manifest.json",
          "fallbackType": "customtabs",
          "enableSiteSettingsShortcut": true,
          "isChromeOSOnly": false,
          "fullScopeUrl": "https://my-store-alaa-3a8a.vercel.app/",
          "appVersion": "1.0.0",
          "alphaDependencies": {
            "enabled": false
          },
          "enableFingerprint": false,
          "retainedBundles": 0,
          "appVersionCodeScheme": "semver",
          "shareTarget": {
            "enabled": false
          },
          "additionalTrustedOrigins": [],
          "enabledFeatures": [],
          "arch": "arm64"
        }
        EOF
        
        echo "✅ TWA Manifest created"

    - name: Generate Signing Key
      run: |
        cd twa-project
        keytool -genkey -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass android123 -keypass android123 -dname "CN=Alaaoo0, OU=MyStore, O=MyStore, L=Beirut, S=Lebanon, C=LB"
        echo "✅ Signing key generated"

    - name: Build APK with Bubblewrap
      run: |
        cd twa-project
        bubblewrap init --manifest=twa-manifest.json --directory=. || true
        bubblewrap build || true
        echo "✅ APK build attempted"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: twa-project/**/*.apk
